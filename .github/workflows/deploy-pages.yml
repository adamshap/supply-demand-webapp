name: Deploy dashboard
on:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - name: Check refresh, release dates and snapshot packaging
        run: |
          node automation/tests/test_data_refresh.js
          node automation/tests/test_dashboard_status.js
          python -m unittest discover -s automation/tests -p test_package_site.py
      - name: Stage public dashboard files
        run: python automation/package_site.py --output _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v5
