name: Deploy dashboard
on:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - name: Check refresh, release dates and snapshot packaging
        run: |
          node automation/tests/test_data_refresh.js
          node automation/tests/test_dashboard_status.js
          python -m unittest discover -s automation/tests -p test_package_site.py
      - name: Stage public dashboard files
        run: python automation/package_site.py --output _site
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: automation/preview/package-lock.json
      - name: Install pinned offline chart renderer
        working-directory: automation/preview
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Generate sharing image from the staged data snapshot
        run: |
          node --test automation/preview/preview.test.mjs
          node automation/preview/render.mjs --site _site
      - name: Verify new uploads and benchmark revisions refresh the image
        run: python automation/preview/test_uploads.py _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait for GitHub artifact indexing before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - name: Retry publication after artifact indexing
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before final publication attempt
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 30
      - name: Final publication attempt
        id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Save preview and upload-test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-sharing-preview
          path: |
            _site/preview.png
            _site/preview-release.json
            preview-upload-test-results.json
          retention-days: 30
          if-no-files-found: warn
